name: Source links

# Every claim about a real app cites a source. A dead source is a broken claim.

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths: ["src/lib/apps.ts", "src/content/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30
            --accept 200,206,429 --exclude-path node_modules
            "src/**/*.ts" "src/**/*.mdx" "src/**/*.astro" README.md
          fail: ${{ github.event_name == 'pull_request' }}
      - if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file lychee/out.md
          else
            gh label create broken-links --repo "$GITHUB_REPOSITORY" --color B60205 --force
            gh issue create --repo "$GITHUB_REPOSITORY" --label broken-links \
              --title "Source links broken" --body-file lychee/out.md
          fi
