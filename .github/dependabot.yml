version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6. Lift this once it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "svelte"]
      fonts:
        patterns: ["@fontsource/*", "@fontsource-variable/*"]
      tooling:
        patterns: ["@biomejs/*", "typescript", "@types/*"]
      test:
        patterns: ["vitest", "jsdom", "@playwright/test", "@axe-core/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
